# Pi Bot configuration (Codex-style TOML). Copy to ~/.config/pi-bot/config.toml
# or point PI_BOT_CONFIG / `pi-bot serve --config <path>` at it.
# Unknown keys are rejected.

[server]
# Loopback or tailnet (100.64.0.0/10, fd7a:115c:a1e0::/48) only. Public addresses are rejected.
host = "127.0.0.1"
port = 4317
# web_dir = "../apps/web/dist"   # defaults to the built apps/web next to the server package

[storage]
# Shared SQLite database (pi-bot.sqlite, mode 0600) lives here; the directory is created 0700.
data_dir = "~/.local/share/pi-bot"

# Model roles: provider/model-id from the pi-ai catalog. There is no model picker.
[models]
orchestrator = "openai/gpt-6-sol"   # main channel and threads
background = "openai/gpt-6-luna"    # extraction and other background work

# Thread titles: generated once from a thread's first message with Woven Matter's title prompt.
# Metadata only (thread listing and search); the UI shows no thread names and threads can't be renamed.
[models.titles]
model = "openai-codex/gpt-6-luna"
reasoning = "high"                  # minimal | low | medium | high | xhigh

[extraction]
schedule = "0 3 * * *"              # 5-field cron
timezone = "America/New_York"       # IANA zone the schedule is evaluated in

[bot_to_bot]
max_rounds_per_request = 5
max_messages_per_hour_per_pair = 30

# Automatic compaction, identical for the main channel and every thread. Covered turns stay in
# SQLite (search and read_thread see everything); only the model context gets shorter.
[compaction]
enabled = true
reserve_tokens = 16384        # compact once the context exceeds the model window minus this
keep_recent_tokens = 20000    # newest context kept verbatim
background_tokens = 0         # 0 = never compact in the background (Woven's setting)
# auto = provider-native compaction for OpenAI, xAI, ChatGPT/Codex and Anthropic;
#        Pi Durable's summarizer for everything else. off = always Pi Durable.
native = "auto"
# [compaction.models."openai/gpt-6-sol"]
# reserve_tokens = 32768

[credentials]
# auto = macOS Keychain on a Mac (stubbed in milestone 1, falls back), encrypted SQLite elsewhere.
backend = "auto"
# key_file = "~/.local/share/pi-bot/credentials.key"   # AES-256-GCM key, mode 0600
