# Pi Bot configuration (Codex-style TOML). Copy to ~/.config/pi-bot/config.toml
# or point PI_BOT_CONFIG / `pi-bot serve --config <path>` at it.
# Unknown keys are rejected.

[server]
# Loopback or tailnet (100.64.0.0/10, fd7a:115c:a1e0::/48) only. Public addresses are rejected.
host = "127.0.0.1"
port = 4317
# web_dir = "../apps/web/dist"   # defaults to the built apps/web next to the server package

[storage]
# Shared SQLite database (pi-bot.sqlite, mode 0600) lives here; the directory is created 0700.
data_dir = "~/.local/share/pi-bot"

# Models: provider/model-id from the pi-ai catalog. Every bot runs one model profile; new bots get
# the default one. Older configs with [models] orchestrator/background still load: they become a
# "default" profile (the background model as its background pool entry) and are rewritten on start.
[models]
default_profile = "default"

# Thread titles: generated once from a thread's first message with Woven Matter's title prompt.
# Shown read-only in the thread list and used for search; threads can't be renamed.
# Precedence: an explicit model here titles every thread. Without one, each bot's pool background
# model is used, falling back quietly to the default openai-codex/gpt-6-luna.
[models.titles]
model = "openai-codex/gpt-6-luna"
reasoning = "high"                  # minimal | low | medium | high | xhigh

# A profile: the main model runs the main channel and every thread; it can hand self-contained
# tasks to pool models with run_subagent (it picks the model and reasoning level). background = true
# marks the pool entry for background work: thread titles (when [models.titles] model is unset) and
# run_subagent with model = "background"; without one, background work uses the main model. Admin Bot
# and Settings → Profiles edit these; changes apply from each bot's next reply.
[profiles.default]
name = "Default"
main = "openai/gpt-6-sol"
# Optional, 0–5 models tried in order when the main model hits a subscription usage limit
# (5-hour, weekly or other) or its API key runs out of credits. Pi Bot switches back when the
# main model resets (or retries it after a ~15-minute cooldown when the provider gave no reset).
# No fallbacks: the bot pauses and the chat says why. Transient rate limits just retry.
fallbacks = ["claude-subscription/claude-opus-5-5", "openrouter/openai/gpt-6.1-sol"]
guidance = "Prefer the cheaper pool models for lookups and summaries."

[profiles.default.pool."openai/gpt-6-luna"]
use_for = "Quick lookups, summaries and background work"
background = true

[profiles.default.pool."openrouter/anthropic/claude-sonnet-5"]
use_for = "Careful writing and code review"

# Memory extraction: each bot's new messages since its last extraction go to its background model
# (else its main model), and new durable facts are appended to the bot's memory, which it sees in
# its prompt. Runs on the schedule and when a bot has been idle idle_minutes after new messages;
# bots with nothing new are skipped. Without this section: on, nightly 03:00 UTC plus 30 idle minutes.
[extraction]
enabled = true
schedule = "0 3 * * *"              # 5-field cron
timezone = "America/New_York"       # IANA zone the schedule is evaluated in
idle_minutes = 30                   # 0 = schedule only

[bot_to_bot]
max_rounds_per_request = 5          # message_bot hops in the chain that follows one user message
max_messages_per_hour_per_pair = 30 # message_bot sends per sender→target pair, sliding hour

# Automatic compaction, identical for the main channel and every thread. Covered turns stay in
# SQLite; only the model context gets shorter.
[compaction]
enabled = true
reserve_tokens = 16384        # compact once the context exceeds the model window minus this
keep_recent_tokens = 20000    # newest context kept verbatim
background_tokens = 0         # 0 = never compact in the background (Woven's setting)
# auto = provider-native compaction for OpenAI, xAI, ChatGPT/Codex and Anthropic;
#        Pi Durable's summarizer for everything else. off = always Pi Durable.
native = "auto"
# [compaction.models."openai/gpt-6-sol"]
# reserve_tokens = 32768

[search]
# Default web search provider: exa | brave | firecrawl. Keys are set in Settings → Search
# (stored in the credential store, never in this file). No bot has a search tool yet.
provider = "exa"

[git]
# Commit identity for the bots' git work (also editable in Settings → GitHub). The SSH key lives in
# the credential store, never in this file.
# user_name = "Trey Moore"
# user_email = "trey@example.com"

[environment]
# Where bots' tools (bash, read, write, edit, …) run. "none": no tools. "docker": one container per
# bot (see docs/environments.md). Model and search credentials never enter a container; the
# Settings → GitHub SSH key and git identity do.
backend = "none"
# image = "pi-bot-env:latest"   # default: built from packages/server/docker on first use

[credentials]
# auto = encrypted SQLite (a macOS Keychain store exists only as a stub, so Macs fall back to it too).
# "keychain" is not implemented yet and fails at startup.
backend = "auto"
# key_file = "~/.local/share/pi-bot/credentials.key"   # AES-256-GCM key, mode 0600
